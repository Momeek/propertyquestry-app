name: PropertyQuest CI/CD

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  build-and-sonar:
    name: Build and analyze app
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('properQuestServer/package-lock.json', 'PropertyQuestClient/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Cache SonarQube data
        uses: actions/cache@v4
        with:
          path: ~/.sonar
          key: ${{ runner.os }}-sonar-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-sonar-

      - name: Cache Trivy DB
        uses: actions/cache@v4
        with:
          path: ~/.cache/trivy
          key: ${{ runner.os }}-trivy-${{ hashFiles('properQuestServer/package-lock.json', 'PropertyQuestClient/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-trivy-

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            properQuestServer/package-lock.json
            PropertyQuestClient/package-lock.json

      - name: Install backend dependencies
        working-directory: properQuestServer
        run: npm install --no-fund --no-audit

      - name: Install frontend dependencies
        working-directory: PropertyQuestClient
        run: npm install --no-fund --no-audit

      - name: Build backend app
        working-directory: properQuestServer
        run: npm run build

      - name: Build frontend app
        working-directory: PropertyQuestClient
        run: npm run build

      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@v2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
        with:
          projectBaseDir: .

  docker-build-push:
    name: Build and push Docker images to ECR
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
      ecr_registry: ${{ steps.login-ecr.outputs.registry }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.CI_AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image metadata
        id: meta
        shell: bash
        run: |
          echo "image_tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build backend image
        shell: bash
        run: |
          docker build -t "${{ steps.login-ecr.outputs.registry }}/propertrybackendimg:${GITHUB_SHA}" -t "${{ steps.login-ecr.outputs.registry }}/propertrybackendimg:latest" -f properQuestServer/Dockerfile properQuestServer

      - name: Trivy scan backend image
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: image
          image-ref: "${{ steps.login-ecr.outputs.registry }}/propertrybackendimg:${{ github.sha }}"
          format: table
          output: trivy-backend-image.txt
          severity: HIGH,CRITICAL
          exit-code: "0"

      - name: Upload backend Trivy report
        uses: actions/upload-artifact@v4
        with:
          name: backend-image-trivy-report
          path: trivy-backend-image.txt
          if-no-files-found: warn

      - name: Push backend image
        shell: bash
        run: |
          docker push "${{ steps.login-ecr.outputs.registry }}/propertyquestrybackendimg:${GITHUB_SHA}"
          docker push "${{ steps.login-ecr.outputs.registry }}/propertyquestrybackendimg:latest"

      - name: Build frontend image
        shell: bash
        run: |
          docker build -t "${{ steps.login-ecr.outputs.registry }}/propertyquestryfrontendimg:${GITHUB_SHA}" -t "${{ steps.login-ecr.outputs.registry }}/propertyquestryfrontendimg:latest" -f PropertyQuestClient/Dockerfile PropertyQuestClient

      - name: Trivy scan frontend image
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: image
          image-ref: "${{ steps.login-ecr.outputs.registry }}/propertyquestryfrontendimg:${{ github.sha }}"
          format: table
          output: trivy-frontend-image.txt
          severity: HIGH,CRITICAL
          exit-code: "0"

      - name: Upload frontend Trivy report
        uses: actions/upload-artifact@v4
        with:
          name: frontend-image-trivy-report
          path: trivy-frontend-image.txt
          if-no-files-found: warn

      - name: Push frontend image
        shell: bash
        run: |
          docker push "${{ steps.login-ecr.outputs.registry }}/propertyquestryfrontendimg:${GITHUB_SHA}"
          docker push "${{ steps.login-ecr.outputs.registry }}/propertyquestryfrontendimg:latest"

  update-helm:
    name: Update Helm values
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: docker-build-push
    runs-on: ubuntu-latest
    env:
      IMAGE_TAG: ${{ needs.docker-build-push.outputs.image_tag }}
      ECR_REGISTRY: ${{ needs.docker-build-push.outputs.ecr_registry }}

    steps:
      - name: Install yq
        shell: bash
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
          yq --version

      - name: Clone Helm repository
        shell: bash
        run: |
          git clone "https://${{ vars.HELM_REPO_USER }}:${{ secrets.GITOPS_PAT }}@github.com/${{ github.repository_owner }}/${{ vars.HELM_REPO_NAME }}.git" helm-repo

      - name: Update backend values
        shell: bash
        run: |
          cd helm-repo
          if yq e '.backend' helm/propertyquest/values.yaml >/dev/null 2>&1; then
            yq -i '.backend.image = strenv(ECR_REGISTRY) + "/propertrybackendimg" | .backend.tag = strenv(IMAGE_TAG)' helm/propertyquest/values.yaml
          elif yq e '.app' helm/propertyquest/values.yaml >/dev/null 2>&1; then
            yq -i '.app.image = strenv(ECR_REGISTRY) + "/propertrybackendimg" | .app.tag = strenv(IMAGE_TAG)' helm/propertyquest/values.yaml
          fi

      - name: Update frontend values
        shell: bash
        run: |
          cd helm-repo
          if yq e '.frontend' helm/propertyquest/values.yaml >/dev/null 2>&1; then
            yq -i '.frontend.image = strenv(ECR_REGISTRY) + "/propertryfrontendimg" | .frontend.tag = strenv(IMAGE_TAG)' helm/propertyquest/values.yaml
          elif yq e '.app' helm/propertyquest/values.yaml >/dev/null 2>&1; then
            yq -i '.app.image = strenv(ECR_REGISTRY) + "/propertryfrontendimg" | .app.tag = strenv(IMAGE_TAG)' helm/propertyquest/values.yaml
          fi

      - name: Commit and push Helm update
        shell: bash
        run: |
          cd helm-repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add helm/propertyquest/values.yaml
          if git diff --cached --quiet; then
            echo "No chart values changes to commit."
          else
            git commit -m "Update PropertyQuest images to ${IMAGE_TAG}"
            git push origin HEAD:${{ github.ref_name }}
          fi

  slack-notify:
    name: Slack notification
    needs:
      - build-and-sonar
      - docker-build-push
      - update-helm
    if: always()
    runs-on: ubuntu-latest
    env:
      PIPELINE_STATUS: ${{ contains(needs.*.result, 'failure') && 'failure' || contains(needs.*.result, 'cancelled') && 'cancelled' || 'success' }}
    steps:
      - name: Send Slack notification
        uses: slackapi/slack-github-action@v1.27.0
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
        with:
          payload: |
            {
              "text": "${{ github.workflow }}: ${{ env.PIPELINE_STATUS }} on ${{ github.ref_name }}",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*${{ github.workflow }}*\nStatus: *${{ env.PIPELINE_STATUS }}*\nBranch: `${{ github.ref_name }}`\nCommit: `${{ github.sha }}`\nRun: <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View workflow>"
                  }
                }
              ]
            }
